server:
  port: ${SERVER_PORT:18081}

spring:
  application:
    name: xinhe-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/xinhe_nexus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

xinhe:
  onboarding:
    expiry-cleanup-ms: ${XINHE_ONBOARDING_EXPIRY_CLEANUP_MS:300000}
  expense:
    upload-dir: ${XINHE_EXPENSE_UPLOAD_DIR:/data/uploads/expense}
  bootstrap:
    headquarters-code: ${XINHE_HEADQUARTERS_CODE:XINHE}
    headquarters-name: ${XINHE_HEADQUARTERS_NAME:芯河智枢总公司}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
